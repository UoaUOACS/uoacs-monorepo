name: Fly Deploy
description: Deploys an application to Fly.io based on the provided configuration.

inputs:
  CONFIG_FILE:
    description: "Path to the Fly.io configuration file (e.g., apps/website/fly.toml)"
    required: true
  DOCKERFILE:
    description: >
      Path to the Dockerfile, relative to the repository root. The build context
      is always the repository root so the pnpm workspace is available.
    required: true
  FLY_API_TOKEN:
    description: "Fly.io API token for authentication"
    required: true
  APP_NAME:
    description: "Name of the Fly.io application"
    required: true
  SECRETS:
    description: >
      Space-separated names of environment variables to pass to Fly.io as both
      runtime secrets and build secrets. Set their values in the calling step's
      `env` block, so values reach the script through the environment and not
      through expression expansion in the script. The deploy fails if a listed
      name has no value.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Setup Flyctl
      uses: superfly/flyctl-actions/setup-flyctl@master

    # The docker-container driver is needed to export a cache with mode=max.
    - name: Setup Docker Buildx
      uses: docker/setup-buildx-action@v3

    # The image is built on this runner rather than Fly's shared remote
    # builder, which was slow and hung when all apps built on it at once.
    - name: Deploy to Fly.io
      shell: bash
      env:
        FLY_API_TOKEN: ${{ inputs.FLY_API_TOKEN }}
        APP_NAME: ${{ inputs.APP_NAME }}
        CONFIG_FILE: ${{ inputs.CONFIG_FILE }}
        DOCKERFILE: ${{ inputs.DOCKERFILE }}
        SECRETS: ${{ inputs.SECRETS }}
      run: |
        set -euo pipefail

        missing=()
        stage_args=()
        build_args=()
        for name in $SECRETS; do
          if [ -z "${!name-}" ]; then
            missing+=("$name")
            continue
          fi
          stage_args+=("$name=${!name}")
          # env= makes buildx read the value itself, so it stays out of argv.
          build_args+=(--secret "id=$name,env=$name")
        done

        # An empty value would replace the app's current secret, so stop first.
        if [ ${#missing[@]} -gt 0 ]; then
          echo "::error::Missing deploy secrets for $APP_NAME: ${missing[*]}"
          exit 1
        fi

        # The Dockerfiles take this as BUILD_SECRETS_HASH so a changed secret
        # busts the build layer cache. Only the hash leaves the runner.
        secrets_hash=$(for name in $SECRETS; do printf '%s=%s\0' "$name" "${!name}"; done \
          | sha256sum | cut -d' ' -f1)

        image="registry.fly.io/$APP_NAME:$GITHUB_SHA"
        # One cache per app, so staging and production never share build layers.
        cache="registry.fly.io/$APP_NAME:buildcache"

        flyctl auth docker

        # --provenance=false pushes a single image manifest, not an index with
        # an attestation, the same as the remote builder produced.
        docker buildx build . \
          --file "$DOCKERFILE" \
          --tag "$image" \
          --push \
          --provenance=false \
          --build-arg "BUILD_SECRETS_HASH=$secrets_hash" \
          --cache-from "type=registry,ref=$cache" \
          --cache-to "type=registry,ref=$cache,mode=max,image-manifest=true,oci-mediatypes=true" \
          "${build_args[@]}"

        # Staged secrets are applied by the deploy, so there is one release.
        if [ ${#stage_args[@]} -gt 0 ]; then
          flyctl secrets set --stage -a "$APP_NAME" "${stage_args[@]}"
        fi

        flyctl deploy \
          -a "$APP_NAME" \
          --config "$CONFIG_FILE" \
          --image "$image"
