name: CI Pipeline

on:
  push:
    branches: [ main, release/* ]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Biome
        uses: biomejs/setup-biome@v2

      - name: Run Biome
        run: biome ci . --error-on-warnings

  setup:
    name: Setup
    needs: [ lint ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check if node_modules cache exists
        id: cache-check
        uses: actions/cache@v5
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: ${{ runner.os }}-node_modules-${{ hashFiles('**/pnpm-lock.yaml') }}
          lookup-only: true

      - name: Setup Node.js
        if: steps.cache-check.outputs.cache-hit != 'true'
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"

      - name: Setup pnpm
        if: steps.cache-check.outputs.cache-hit != 'true'
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Install dependencies
        if: steps.cache-check.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Save node_modules cache
        if: steps.cache-check.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: ${{ runner.os }}-node_modules-${{ hashFiles('**/pnpm-lock.yaml') }}

  type-check:
    name: Type Checking
    runs-on: ubuntu-latest
    needs: [ lint, setup ]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Restore node_modules cache
        uses: actions/cache/restore@v5
        id: cache
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: ${{ runner.os }}-node_modules-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-node_modules

      - name: Install dependencies if cache misses
        if: steps.cache.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run Type Check
        env:
          NODE_ENV: production
          # `next typegen` calls the website's redirects(), which needs these.
          NEXT_PUBLIC_WEBSITE_URL: http://localhost:3000
          NEXT_PUBLIC_AUTH_URL: http://localhost:3002
        run: pnpm types:check

  codegen:
    name: Codegen
    runs-on: ubuntu-latest
    needs: [ lint, setup ]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Restore node_modules cache
        uses: actions/cache/restore@v5
        id: cache
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: ${{ runner.os }}-node_modules-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-node_modules

      - name: Install dependencies if cache misses
        if: steps.cache.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Generate typing
        env:
          NODE_ENV: production
          # `next typegen` calls the website's redirects(), which needs these.
          NEXT_PUBLIC_WEBSITE_URL: http://localhost:3000
          NEXT_PUBLIC_AUTH_URL: http://localhost:3002
        run: pnpm types:generate

      - name: Write git diff
        run: |
          if git diff --quiet; then
            echo "TYPE_GEN_DIFF=0" >> $GITHUB_ENV
          else
            echo "TYPE_GEN_DIFF=1" >> $GITHUB_ENV
          fi

      - name: Check for differences in typing
        if: ${{ env.TYPE_GEN_DIFF != '0'}}
        uses: actions/github-script@v7
        with:
          script: |
            core.setFailed('Your code generation for typings are not up to date. Run pnpm types:generate')

  build-app:
    name: Build Applications
    runs-on: ubuntu-latest
    needs: [ lint, setup, type-check ]
    permissions:
      contents: read
      # Lets the job delete the build cache entries its save replaces.
      actions: write
    services:
      mongo:
        # Matches production. Pinned so CI does not move to a new release on its own.
        image: mongo:8.0.34
        ports:
          - 27017:27017
        env:
          # MongoDB 8 can crash on runner kernels 6.19 to 7.0.13, which change rseq behaviour that
          # its tcmalloc relies on. Remove once runners have kernel 7.0.14+. See SERVER-125742.
          GLIBC_TUNABLES: glibc.pthread.rseq=1
        # The image has no health check, so without this the job starts while Mongo is still down
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URI: mongodb://localhost:27017/ci
      PAYLOAD_SECRET: ci-placeholder
      BETTER_AUTH_SECRET: ci-placeholder
      DISCORD_SERVER_ID: ci-placeholder
      NEXT_PUBLIC_WEBSITE_URL: http://localhost:3000
      NEXT_PUBLIC_PROJECTS_URL: http://localhost:3001
      NEXT_PUBLIC_AUTH_URL: http://localhost:3002
      S3_ACCESS_KEY_ID: ci-placeholder
      S3_SECRET_ACCESS_KEY: ci-placeholder
      S3_REGION: ci-placeholder
      S3_BUCKET: ci-placeholder
      RESEND_API_KEY: ci-placeholder
      GOOGLE_WALLET_ISSUER_ID: ci-placeholder
      # base64 of "{}", as the wallet module parses this at import time
      GOOGLE_WALLET_SERVICE_ACCOUNT_KEY: e30=
    strategy:
      matrix:
        include:
          - app: website
            package: "@uoacs/website"
          - app: playground
            package: "@uoacs/playground"
          - app: auth
            package: "@uoacs/auth"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Restore node_modules cache
        uses: actions/cache/restore@v5
        id: cache
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: ${{ runner.os }}-node_modules-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-node_modules

      - name: Install dependencies if cache misses
        if: steps.cache.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile --ignore-scripts
        shell: bash

      # Keyed per app so parallel matrix legs don't stomp each other's
      # cache entry under one shared key.
      - name: Restore build cache
        id: build-cache
        uses: actions/cache/restore@v5
        with:
          # .turbo is left out: it holds whole build outputs and grows on every
          # save, which pushed other entries out under the 10GB limit.
          path: apps/${{ matrix.app }}/.next/cache
          key: ${{ runner.os }}-build-${{ matrix.app }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-build-${{ matrix.app }}-${{ hashFiles('pnpm-lock.yaml') }}-
            ${{ runner.os }}-build-${{ matrix.app }}-

      - name: Build
        env:
          NODE_ENV: production
        run: pnpm build --filter=${{ matrix.package }}

      # Only main writes an entry. PR runs still read the cache, but don't each
      # add a copy that pushes the shared node_modules cache out under the 10GB
      # LRU limit.
      - name: Save build cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v5
        with:
          path: apps/${{ matrix.app }}/.next/cache
          key: ${{ steps.build-cache.outputs.cache-primary-key }}

      # Delete only entries older than this run's, so parallel runs and reruns
      # keep newer ones.
      - name: Delete older build caches
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_KEY: ${{ steps.build-cache.outputs.cache-primary-key }}
        run: |
          gh cache list --ref refs/heads/main --key "${{ runner.os }}-build-${{ matrix.app }}-" --limit 100 --json id,key,createdAt \
            --jq '(map(select(.key == env.CURRENT_KEY)) | first | .createdAt) as $current
              | .[] | select($current != null and .createdAt < $current) | .id' \
            | xargs -r -n1 gh cache delete

  build-storybook:
    name: Build Storybook
    runs-on: ubuntu-latest
    needs: [ lint, setup, type-check ]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Restore node_modules cache
        uses: actions/cache/restore@v5
        id: cache
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: ${{ runner.os }}-node_modules-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node_modules

      - name: Install dependencies if cache misses
        if: steps.cache.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build Storybook
        shell: bash
        run: pnpm storybook:build
